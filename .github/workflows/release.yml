name: Release

on:
  workflow_dispatch:
    inputs:
      message_title:
        description: '업데이트 제목'
        required: true
        default: '업데이트 안내'
      message:
        description: '업데이트 내용'
        required: true
        default: '안정적인 이용을 위해 최신 버전으로 업데이트해 주세요.'
      target_version:
        description: '롤백 대상 버전 코드 (일반 배포 시 비워두세요)'
        required: false
        default: ''

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Get version info
        id: version
        run: |
          VERSION_CODE=$(grep "versionCode" app/build.gradle.kts | grep -o '[0-9]*' | head -1)
          VERSION_NAME=$(grep "versionName" app/build.gradle.kts | grep -o '"[0-9.]*"' | tr -d '"' | head -1)
          echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Restore google-services.json
        run: echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > app/google-services.json

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > app/my-release-key.jks

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        env:
          KEYSTORE_PATH: my-release-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          API_ID: ${{ secrets.API_ID }}
          API_PASSWORD: ${{ secrets.API_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Find APK
        run: find app/build/outputs -name "*.apk" -type f

      - name: Upload APK to S3
        run: |
          aws s3 cp app/build/outputs/apk/release/app-release.apk \
            s3://${{ secrets.S3_BUCKET_NAME }}/pharmPoint/pharmPoint-v${{ steps.version.outputs.code }}.apk

      - name: Get auth token
        id: auth
        run: |
          RESPONSE=$(curl -s -X POST ${{ secrets.API_BASE_URL }}/api/v1/app-support/auth/token \
            -H "Content-Type: application/json;charset=UTF-8" \
            -d "{\"id\": \"${{ secrets.API_ID }}\", \"password\": \"${{ secrets.API_PASSWORD }}\"}")
          TOKEN=$(echo "$RESPONSE" | jq -r '.token')
          REFRESH_TOKEN=$(echo "$RESPONSE" | jq -r '.refreshToken')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "토큰 발급 실패: $RESPONSE"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "::add-mask::$REFRESH_TOKEN"
          echo "token=$TOKEN" >> $GITHUB_OUTPUT
          echo "refresh_token=$REFRESH_TOKEN" >> $GITHUB_OUTPUT

      - name: Register version to server
        run: |
          MESSAGE_TITLE="${{ github.event.inputs.message_title }}"
          MESSAGE="${{ github.event.inputs.message }}"
          TARGET_VERSION="${{ github.event.inputs.target_version }}"
          if [ -z "$TARGET_VERSION" ]; then
            TARGET_VERSION_JSON="null"
          else
            TARGET_VERSION_JSON="$TARGET_VERSION"
          fi
          HTTP_CODE=$(curl -s -o /tmp/response.txt -w "%{http_code}" -X POST ${{ secrets.API_BASE_URL }}/api/v1/app-support/version \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ steps.auth.outputs.token }}" \
            -d "{
              \"platform\": \"pharmPoint\",
              \"versionCode\": ${{ steps.version.outputs.code }},
              \"versionName\": \"${{ steps.version.outputs.name }}\",
              \"targetVersion\": $TARGET_VERSION_JSON,
              \"messageTitle\": \"$MESSAGE_TITLE\",
              \"message\": \"$MESSAGE\"
            }")
          RESPONSE=$(cat /tmp/response.txt)
          echo "HTTP Status: $HTTP_CODE"
          echo "Response: $RESPONSE"
          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "서버 오류: HTTP $HTTP_CODE"
            exit 1
          fi

      - name: Logout
        if: always() && steps.auth.outputs.refresh_token != ''
        run: |
          curl -s -X POST ${{ secrets.API_BASE_URL }}/api/v1/app-support/auth/logout \
            -H "Content-Type: application/json;charset=UTF-8" \
            -d "{\"refreshToken\": \"${{ steps.auth.outputs.refresh_token }}\"}"
