name: Release

on:
  push:
    branches: [ release ]
  workflow_dispatch:
    inputs:
      message_title:
        description: '업데이트 제목'
        required: true
        default: '업데이트 안내'
      message:
        description: '업데이트 내용'
        required: true
        default: '안정적인 이용을 위해 최신 버전으로 업데이트해 주세요.'

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Get version info
        id: version
        run: |
          VERSION_CODE=$(grep "versionCode" app/build.gradle.kts | grep -o '[0-9]*' | head -1)
          VERSION_NAME=$(grep "versionName" app/build.gradle.kts | grep -o '"[0-9.]*"' | tr -d '"' | head -1)
          echo "code=$VERSION_CODE" >> $GITHUB_OUTPUT
          echo "name=$VERSION_NAME" >> $GITHUB_OUTPUT

      - name: Set up JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Find APK
        run: find app/build/outputs -name "*.apk" -type f

      - name: Upload APK to S3
        run: |
          aws s3 cp app/build/outputs/apk/release/app-release.apk \
            s3://${{ secrets.S3_BUCKET_NAME }}/catpos/catpos-v${{ steps.version.outputs.code }}.apk

      - name: Register version to server
        run: |
          MESSAGE_TITLE="${{ github.event.inputs.message_title || '업데이트 안내' }}"
          MESSAGE="${{ github.event.inputs.message || '안정적인 이용을 위해 최신 버전으로 업데이트해 주세요.' }}"
          curl -X POST ${{ secrets.API_BASE_URL }}/api/app/version \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.API_TOKEN }}" \
            -d "{
              \"platform\": \"PharmPoint\",
              \"versionCode\": ${{ steps.version.outputs.code }},
              \"versionName\": \"${{ steps.version.outputs.name }}\",
              \"messageTitle\": \"$MESSAGE_TITLE\",
              \"message\": \"$MESSAGE\"
            }"
